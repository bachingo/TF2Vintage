name: Windows
on:
  workflow_call:
    inputs:
      build_config:
        description: 'MSBuild configuration — Release or Debug'
        type: string
        default: 'Release'

env:
  CCACHE_DIR: ${{ github.workspace }}\.ccache

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          sparse-checkout: |
            src/
          sparse-checkout-cone-mode: false

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache
        run: |
          $version = "4.10.2"
          $url = "https://github.com/ccache/ccache/releases/download/v${version}/ccache-${version}-windows-x86_64.zip"
          Invoke-WebRequest $url -OutFile ccache.zip
          Expand-Archive ccache.zip -DestinationPath "$env:LOCALAPPDATA\ccache-bin"
          
          # Find the absolute path to ccache.exe and save it for all future steps
          $ccacheExe = (Get-ChildItem "$env:LOCALAPPDATA\ccache-bin" -Filter ccache.exe -Recurse | Select-Object -First 1).FullName
          echo "CCACHE_EXE_PATH=$ccacheExe" | Out-File -Append -FilePath $env:GITHUB_ENV
          
          # Add directory to PATH as a fallback
          echo "$(Split-Path $ccacheExe)" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ inputs.build_config }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.build_config }}-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          # Locate the real MSVC compiler to prevent ccache from calling itself recursively
          $realCl = (where.exe cl.exe | Select-Object -First 1)
          
          # Use the absolute path to the ccache binary for configuration
          & "${{ env.CCACHE_EXE_PATH }}" --set-config="cache_dir=${{ env.CCACHE_DIR }}"
          & "${{ env.CCACHE_EXE_PATH }}" --set-config="max_size=4.0G"
          & "${{ env.CCACHE_EXE_PATH }}" --set-config="compiler_check=mtime"
          & "${{ env.CCACHE_EXE_PATH }}" --set-config="compiler=$realCl"
          & "${{ env.CCACHE_EXE_PATH }}" --zero-stats

      - name: Create project
        run: |
          cd src
          .\createtf2vintage.bat

      - name: Build project
        run: |
          cd src
          # Pass the absolute path of ccache to MSBuild to satisfy the 'rooted path' requirement
          MSBuild.exe TF2vintage.sln `
            /p:Configuration=${{ inputs.build_config }} `
            /p:Platform="win64" `
            /p:CLToolExe="${{ env.CCACHE_EXE_PATH }}" `
            /p:UseSharedCompilation=false `
            /p:TrackFileAccess=false `
            /m /v:m

      - name: Print ccache stats
        if: always()
        run: & "${{ env.CCACHE_EXE_PATH }}" --show-stats

      - name: Collect binaries into bin/x64
        shell: cmd
        run: |
          mkdir game\tf2vintage\bin\x64 2>nul || true
          set CFG=${{ inputs.build_config }}
          copy /Y src\game\client\%CFG%_mod_tf\client.dll game\tf2vintage\bin\x64\
          copy /Y src\game\client\%CFG%_mod_tf\client.pdb game\tf2vintage\bin\x64\ 2>nul
          copy /Y src\game\server\%CFG%_mod_tf\server.dll game\tf2vintage\bin\x64\
          copy /Y src\game\server\%CFG%_mod_tf\server.pdb game\tf2vintage\bin\x64\ 2>nul
          copy /Y src\thirdparty\crash_handler\%CFG%tf2vintage\x64\crash_handler.dll game\tf2vintage\bin\x64