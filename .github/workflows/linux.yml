name: Linux
on:
  workflow_call:
    inputs:
      build_config:
        description: 'Build configuration — Release or Debug'
        type: string
        default: 'Release'

env:
  CCACHE_VERSION: 4.0
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip build-essential gcc-multilib g++-multilib ccache binutils

      - name: Setup ccache
        run: |
          mkdir -p game/tf2vintage/bin/linux64
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=2.0G

      - name: Make createtf2vintage executable
        run: chmod +x src/createtf2vintage

      - name: Make vpc executable
        run: chmod +x src/devtools/bin/vpc

      - name: Make protoc executable
        run: chmod +x src/thirdparty/protobuf-2.6.1/bin/linux32/protoc

      - name: Clear stale ninja solution
        run: rm -f src/_vpc_/ninja/sdk_everything_release.ninja src/_vpc_/ninja/sdk_everything_debug.ninja
        
      - name: Build
        env:
          BUILD_TYPE: ${{ inputs.build_config }}
        run: |
          cd src
          bash createtf2vintage
      
      - name: Collect binaries into bin/linux64
        run: |
          mkdir -p game/tf2vintage/bin/linux64

          # client.so / server.so — MSBuild outputs these to game/mod_tf/bin/linux64/
          find game/mod_tf/bin/linux64/ -maxdepth 1 -name "*.so" \
            -exec cp {} game/tf2vintage/bin/linux64/ \;

          # crash_handler.so and other tf2vintage-specific libs already land
          # directly in game/tf2vintage/bin/linux64/ — nothing to move there.

          # launcher_tf2vintage (main executable) — lands in the mod root if present
          find game/tf2vintage/ -maxdepth 1 -name "launcher_tf2vintage*" \
            -exec mv {} game/tf2vintage/bin/linux64/ \;

      - name: Split debug symbols from binaries
        run: |
          mkdir -p debug-symbols
          # Process all .so files AND the launcher executable
          find game/tf2vintage/bin/linux64/ \( -name "*.so" -o -name "launcher_tf2vintage" \) | while read lib; do
            base=$(basename "$lib")
            dbg="debug-symbols/${base}.debug"

            # 1. Extract DWARF into a sidecar .debug file
            objcopy --only-keep-debug "$lib" "$dbg"

            # 2. Strip all debug sections from the shipped binary
            objcopy --strip-debug "$lib"

            # 3. Embed a GNU debug link so debuggers can locate the sidecar
            #    automatically (addr2line, gdb, crash handler map lookup)
            objcopy --add-gnu-debuglink="$dbg" "$lib"
          done

      - name: Upload product
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux
          path: game/tf2vintage/bin/linux64/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux-debugsymbols
          path: debug-symbols/