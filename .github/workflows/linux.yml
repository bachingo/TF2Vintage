name: Linux
on:
  workflow_call:
    inputs:
      build_config:
        description: 'Build configuration — Release or Debug'
        type: string
        default: 'Release'

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          sparse-checkout: |
            src/
          sparse-checkout-cone-mode: false

      # Most of these packages are pre-installed on ubuntu-24.04 runners.
      # apt caching was removed: apt always writes lock/partial as root so any
      # cached directory fails the post-job tar with Permission denied regardless
      # of where it is pointed. The install itself takes ~2s; the real time
      # saving comes from the ccache step below, not from caching apt.
      - name: Configure Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zip build-essential gcc-multilib g++-multilib ccache binutils

      # ccache key is scoped to the build config so Release and Debug builds
      # never poison each other's cache. The restore-keys fallback lets a new
      # Release build still reuse objects from a previous Release run even when
      # source files have changed — ccache handles per-object staleness itself.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ inputs.build_config }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.build_config }}-
            ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
          mkdir -p game/tf2vintage/bin/linux64
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=4.0G
          # none is safe on ephemeral CI runners — the compiler never changes
          # within a run, so there is nothing to verify.
          ccache --set-config=compiler_check=none
          ccache --zero-stats

          # Inject ccache into the build by prepending a directory of compiler
          # symlinks to PATH. The ninja build invokes gcc/g++ directly and has
          # no ccache hook of its own, so without this ccache is never called
          # and the cache stays empty. Each symlink resolves to the ccache binary
          # at exec time; ccache then calls the real compiler via $PATH remainder.
          mkdir -p "$HOME/ccache-wrappers"
          for compiler in gcc g++ cc c++ gcc-13 g++-13 x86_64-linux-gnu-gcc x86_64-linux-gnu-g++; do
            if command -v "$compiler" &>/dev/null; then
              ln -sf "$(which ccache)" "$HOME/ccache-wrappers/$compiler"
            fi
          done
          echo "$HOME/ccache-wrappers" >> $GITHUB_PATH

      - name: Make createtf2vintage executable
        run: chmod +x src/createtf2vintage

      - name: Make vpc executable
        run: chmod +x src/devtools/bin/vpc

      - name: Make protoc executable
        run: chmod +x src/thirdparty/protobuf-2.6.1/bin/linux32/protoc

      - name: Clear stale ninja solution
        run: rm -f src/_vpc_/ninja/sdk_everything_release.ninja src/_vpc_/ninja/sdk_everything_debug.ninja

      - name: Build
        env:
          BUILD_TYPE: ${{ inputs.build_config }}
        run: |
          cd src
          bash createtf2vintage

      - name: Print ccache stats
        if: always()
        run: ccache --show-stats

      - name: Collect binaries into bin/linux64
        run: |
          mkdir -p game/tf2vintage/bin/linux64

          # client.so / server.so — build copies these to game/mod_tf/bin/linux64/
          find game/mod_tf/bin/linux64/ -maxdepth 1 -name "*.so"             -exec cp {} game/tf2vintage/bin/linux64/ \;

          # The launcher links to ../game/tf2vintage_linux64 (relative to src/),
          # so it lands at the repo root as game/tf2vintage_linux64 — not inside
          # game/tf2vintage/ and not named launcher_tf2vintage.
          cp game/tf2vintage_linux64 game/tf2vintage/launcher_tf2vintage

      - name: Split debug symbols from binaries
        run: |
          mkdir -p debug-symbols
          # Process only .so files in bin/linux64 — launcher_tf2vintage is in the mod root
          find game/tf2vintage/bin/linux64/ -name "*.so" | while read lib; do
            base=$(basename "$lib")
            dbg="debug-symbols/${base}.debug"
            objcopy --only-keep-debug "$lib" "$dbg"
            objcopy --strip-debug "$lib"
            objcopy --add-gnu-debuglink="$dbg" "$lib"
          done

          # Also strip the launcher in the mod root and extract its symbols
          launcher="game/tf2vintage/launcher_tf2vintage"
          if [ -f "$launcher" ]; then
            dbg="debug-symbols/launcher_tf2vintage.debug"
            objcopy --only-keep-debug "$launcher" "$dbg"
            objcopy --strip-debug "$launcher"
            objcopy --add-gnu-debuglink="$dbg" "$launcher"
          fi

      - name: Upload product
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux
          path: |
            game/tf2vintage/bin/linux64/
            game/tf2vintage/launcher_tf2vintage

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux-debugsymbols
          path: debug-symbols/
