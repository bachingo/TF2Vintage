name: Release

on:
  push:
    branches:
      - '3.6'
    paths:
      - 'src/**'
      - 'game/tf2vintage/**'
      - 'tools/updater/**'
  pull_request:
    paths:
      - 'src/**'
      - 'game/tf2vintage/**'
      - 'tools/updater/**'
  schedule:
    # Weekly diff release — every Thursday at 08:00 UTC
    # (03:00 EST winter / 04:00 EDT summer — safely avoids DST clock changes)
    - cron: '0 8 * * 4'
    # Full release — every 90 days (Jan 1, Apr 1, Jul 1, Oct 1)
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'diff'
        type: choice
        options:
          - diff
          - full

env:
  STEAM_RUNTIME_PATH: /valve/steam-runtime
  CCACHE_VERSION: 4.2.1
  CCACHE_DIR: ${{ github.workspace }}/src/ccache

jobs:
  # ── Determine what kind of run this is ───────────────────────────────────────
  # publish:    weekly/quarterly schedule or manual dispatch → create a release
  # full-base:  quarterly schedule, manual full dispatch, or no previous release
  # skip:       push/PR with no schedule → build artifacts only, no release
  classify:
    runs-on: ubuntu-22.04
    outputs:
      should_publish: ${{ steps.classify.outputs.should_publish }}
      full_base: ${{ steps.classify.outputs.full_base }}
      build_type: ${{ steps.classify.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Classify run
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EVENT="${{ github.event_name }}"
          CRON="${{ github.event.schedule }}"
          DISPATCH_TYPE="${{ github.event.inputs.release_type }}"

          # ── Manual full dispatch ─────────────────────────────────────────────
          if [[ "$DISPATCH_TYPE" == "full" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "full_base=true"      >> $GITHUB_OUTPUT
            echo "build_type=Full Release" >> $GITHUB_OUTPUT
            echo "reason=Manual full release requested" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── Manual diff dispatch ─────────────────────────────────────────────
          if [[ "$DISPATCH_TYPE" == "diff" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "full_base=false"     >> $GITHUB_OUTPUT
            echo "build_type=Weekly" >> $GITHUB_OUTPUT
            echo "reason=Manual diff release requested" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── Quarterly full release ───────────────────────────────────────────
          if [[ "$CRON" == "0 0 1 1,4,7,10 *" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "full_base=true"      >> $GITHUB_OUTPUT
            echo "build_type=Full Release" >> $GITHUB_OUTPUT
            echo "reason=Quarterly full release" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── Weekly diff release — only if commits exist since last release ───
          if [[ "$CRON" == "0 8 * * 4" ]]; then
            # Find the tag of the last published release
            LAST_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")

            if [ -z "$LAST_TAG" ]; then
              # No previous release at all — publish a full base as the first one
              echo "should_publish=true" >> $GITHUB_OUTPUT
              echo "full_base=true"      >> $GITHUB_OUTPUT
              echo "build_type=Full Release" >> $GITHUB_OUTPUT
              echo "reason=No previous release found — publishing first full release" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Count commits to tracked paths since the last release tag
            CHANGES=$(git log "${LAST_TAG}..HEAD" --oneline -- \
              src/ \
              'game/tf2vintage/' \
              'tools/updater/' \
              2>/dev/null | wc -l)

            if [ "$CHANGES" -eq 0 ]; then
              echo "should_publish=false" >> $GITHUB_OUTPUT
              echo "full_base=false"      >> $GITHUB_OUTPUT
              echo "build_type=Nightly" >> $GITHUB_OUTPUT
              echo "reason=No commits since last release (${LAST_TAG}) — skipping" >> $GITHUB_OUTPUT
            else
              echo "should_publish=true" >> $GITHUB_OUTPUT
              echo "full_base=false"     >> $GITHUB_OUTPUT
              echo "build_type=Weekly" >> $GITHUB_OUTPUT
              echo "reason=${CHANGES} commit(s) since ${LAST_TAG}" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # ── Push or PR — build only, no release ─────────────────────────────
          echo "should_publish=false" >> $GITHUB_OUTPUT
          echo "full_base=false"      >> $GITHUB_OUTPUT
          echo "build_type=Nightly" >> $GITHUB_OUTPUT
          echo "reason=Push/PR build — artifacts only" >> $GITHUB_OUTPUT

      - name: Log decision
        run: echo "Decision — publish=${{ steps.classify.outputs.should_publish }}, full_base=${{ steps.classify.outputs.full_base }}, reason=${{ steps.classify.outputs.reason }}"


  build-windows:
    uses: ./.github/workflows/windows.yml

  build-linux:
    uses: ./.github/workflows/linux.yml


  # ── Base assets: manifest + delta or full pack depending on schedule ─────────
  package-base:
    needs: classify
    runs-on: ubuntu-22.04
    # Only runs on publishing events where base assets are relevant
    if: needs.classify.outputs.should_publish == 'true'
    steps:
      - name: Checkout game assets
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Write base version.txt
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-9)
          BUILD_DATE=$(date +'%m.%d.%Y')
          {
            echo "version=${BUILD_DATE}-${SHORT_SHA}"
            echo "type=base"
          } > game/tf2vintage/version-base.txt

      - name: Fetch previous release manifest
        id: prev_manifest
        run: |
          PREV_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r '.tag_name // ""')
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          if [ -n "$PREV_TAG" ]; then
            MANIFEST_URL=$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${PREV_TAG}" \
              | jq -r '.assets[] | select(.name=="base-manifest.json") | .browser_download_url')
            if [ -n "$MANIFEST_URL" ]; then
              curl -fsSL "$MANIFEST_URL" -o prev-manifest.json
              echo "has_prev=true" >> $GITHUB_OUTPUT
            else
              echo "has_prev=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_prev=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate current manifest
        run: |
          python3 - << 'PYEOF'
          import os, hashlib, json

          base = "game/tf2vintage"
          files = {}
          for root, dirs, filenames in os.walk(base):
              dirs[:] = [d for d in dirs if not (root == base and d == "bin")]
              for fname in filenames:
                  path = os.path.join(root, fname)
                  rel  = os.path.relpath(path, base)
                  md5  = hashlib.md5(open(path,"rb").read()).hexdigest()
                  files[rel.replace(os.sep, "/")] = md5

          manifest = {
              "tag":      os.environ["TAG"],
              "prev_tag": os.environ.get("PREV_TAG", ""),
              "files":    files,
          }
          with open("base-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
          print(f"Manifest: {len(files)} files")
          PYEOF
        env:
          TAG: build-${{ github.sha }}
          PREV_TAG: ${{ steps.prev_manifest.outputs.prev_tag }}

      - name: Check if base has any changes
        id: base_changes
        run: |
          if [ "${{ steps.prev_manifest.outputs.has_prev }}" != "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          python3 - << 'PYEOF'
          import os, json
          prev = json.load(open("prev-manifest.json"))
          curr = json.load(open("base-manifest.json"))
          changed = [f for f, md5 in curr["files"].items() if prev["files"].get(f) != md5]
          removed = [f for f in prev["files"] if f not in curr["files"]]
          has_changes = bool(changed or removed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_changes={'true' if has_changes else 'false'}\n")
          print(f"{'Changes detected' if has_changes else 'No base changes'}: {len(changed)} modified, {len(removed)} removed")
          PYEOF

      - name: Generate base patch (diff release — changed files only)
        if: |
          needs.classify.outputs.full_base != 'true' &&
          steps.prev_manifest.outputs.has_prev == 'true' &&
          steps.base_changes.outputs.has_changes == 'true'
        run: |
          python3 - << 'PYEOF'
          import os, json, zipfile

          prev  = json.load(open("prev-manifest.json"))
          curr  = json.load(open("base-manifest.json"))
          base  = "game/tf2vintage"
          changed = [f for f, md5 in curr["files"].items() if prev["files"].get(f) != md5]

          print(f"Patch contains {len(changed)} changed/added file(s):")
          with zipfile.ZipFile("base-patch.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for rel in sorted(changed):
                  full = os.path.join(base, rel.replace("/", os.sep))
                  zf.write(full, arcname=os.path.join("tf2vintage", rel))
                  print(f"  + {rel}")
          PYEOF

      - name: Pack full base [zip] (full release or first-ever release)
        if: |
          needs.classify.outputs.full_base == 'true' ||
          steps.prev_manifest.outputs.has_prev != 'true'
        run: |
          cd game
          zip -r ../tf2vintage-base.zip tf2vintage --exclude 'tf2vintage/bin/*'

      - name: Upload base artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-base
          path: |
            tf2vintage-base.zip
            base-manifest.json
            base-patch.zip


  # ── Windows bin: stage .dll and updater.exe for combined package ────────────
  package-windows:
    needs: [classify, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          sparse-checkout: |
            game/tf2vintage/bin/x64/
            tools/updater/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build updater (Windows)
        run: |
          cd tools/updater
          GOOS=windows GOARCH=amd64 go build -o ../../game/tf2vintage/bin/x64/tf2vintage-updater.exe .

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: tf2vintage-windows
          path: game/tf2vintage/bin/x64/

      - name: Stage Windows bin files
        run: |
          mkdir -p staging/bin/x64
          find game/tf2vintage/bin/x64/ -name "*.dll" -o -name "*.exe" | xargs -I{} cp {} staging/bin/x64/

      - name: Upload Windows staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-windows-staging
          path: staging/

      - name: Clean up Windows binary
        uses: geekyeggo/delete-artifact@v5
        with:
          name: tf2vintage-windows


  # ── Linux bin: stage .so and updater for combined package ───────────────────
  package-linux:
    needs: [classify, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          sparse-checkout: |
            game/tf2vintage/bin/x64/
            tools/updater/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build updater (Linux)
        run: |
          cd tools/updater
          GOOS=linux GOARCH=amd64 go build -o ../../game/tf2vintage/bin/x64/tf2vintage-updater .

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: tf2vintage-linux
          path: game/tf2vintage/bin/x64/

      - name: Stage Linux bin files
        run: |
          mkdir -p staging/bin/x64
          find game/tf2vintage/bin/x64/ -name "*.so" -o -name "tf2vintage-updater" | xargs -I{} cp {} staging/bin/x64/

      - name: Upload Linux staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux-staging
          path: staging/

      - name: Clean up Linux binary
        uses: geekyeggo/delete-artifact@v5
        with:
          name: tf2vintage-linux



  # ── Combined bin: merge Windows + Linux into one zip ────────────────────────
  package-bin:
    needs: [classify, package-windows, package-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Windows staging
        uses: actions/download-artifact@v4
        with:
          name: tf2vintage-windows-staging
          path: staging/

      - name: Download Linux staging
        uses: actions/download-artifact@v4
        with:
          name: tf2vintage-linux-staging
          path: staging/

      - name: Write version files
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-9)
          BUILD_DATE=$(date +'%m.%d.%Y')
          BUILD_TYPE="${{ needs.classify.outputs.build_type }}"
          # Single version.txt covering both platforms
          echo "Version=${BUILD_TYPE} | ${BUILD_DATE} | ${SHORT_SHA} | ${{ github.ref_name }}" > staging/bin/x64/version.txt
          {
            echo "commit=${{ github.sha }}"
            echo "short=${SHORT_SHA}"
            echo "date=${BUILD_DATE}"
          } > staging/bin/x64/version-bin.txt

      - name: Generate combined checksums
        run: |
          find staging/bin/x64/ -name "*.dll" -o -name "*.so" -o -name "*.exe" | sort | xargs md5sum > staging/bin/x64/checksums.md5

      - name: Pack combined bin [zip]
        run: |
          cd staging
          zip -r ../tf2vintage-bin.zip bin/x64/

      - name: Upload combined bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-bin
          path: tf2vintage-bin.zip

      - name: Clean up staging artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            tf2vintage-windows-staging
            tf2vintage-linux-staging

  # ── GitHub Release: only on schedule or manual dispatch ─────────────────────
  publish-release:
    needs: [classify, package-bin, package-base]
    runs-on: ubuntu-22.04
    if: needs.classify.outputs.should_publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Set release metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-9)
          BUILD_DATE=$(date +'%m.%d.%Y')
          if [ "${{ needs.classify.outputs.full_base }}" == "true" ]; then
            echo "release_name=Full Release ${BUILD_DATE} (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "release_notes=Full release — includes complete base assets and updated binaries for all platforms." >> $GITHUB_OUTPUT
          else
            echo "release_name=Update ${BUILD_DATE} (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "release_notes=Weekly update — includes binary updates and base asset patches since the last release." >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          body: ${{ steps.meta.outputs.release_notes }}
          files: |
            dist/tf2vintage-bin/tf2vintage-bin.zip
            dist/tf2vintage-base/tf2vintage-base.zip
            dist/tf2vintage-base/base-manifest.json
            dist/tf2vintage-base/base-patch.zip
