name: Windows

on: 
  workflow_call:

jobs:
  build:
    runs-on:
      windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Configure dependencies
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create project
        run: |
          cd src
          devtools/bin/vpc.exe /tf2vintage /define:SOURCESDK /define:TF +game TF2vintage.sln

      - name: Build project
        run: cd src;devenv TF2vintage.sln /Build Release

      - name: Upload product
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-windows
          path: game/tf2vintage/bin/
