name: Linux
on:
  workflow_call:
    inputs:
      build_config:
        description: 'Build configuration — Release or Debug'
        type: string
        default: 'Release'

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          sparse-checkout: |
            src/
          sparse-checkout-cone-mode: false

      # Cache the downloaded .deb files only — NOT the whole archives directory.
      # Caching /var/cache/apt/archives directly includes the root-owned "lock"
      # file and "partial/" directory, which tar cannot read as the runner user,
      # causing the post-job cache-save step to fail with Permission denied.
      # Narrowing to a dedicated debs/ directory avoids that entirely.
      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          # Include runner image in key so a cache built on ubuntu-24.04 is never
          # restored on a ubuntu-22.04 runner (different package versions).
          key: apt-linux-build-ubuntu-24.04-v1

      - name: Configure Dependencies
        run: |
          # apt requires a "partial/" subdirectory to exist inside any custom
          # Dir::Cache::archives directory before it will download into it.
          # Without this mkdir the download step fails immediately with:
          # "Archives directory .../apt-debs/partial is missing."
          mkdir -p ~/apt-debs/partial

          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
            # Download packages to our cache directory without installing yet.
            sudo apt-get install -y --no-install-recommends \
              --download-only -o Dir::Cache::archives="$HOME/apt-debs" \
              zip build-essential gcc-multilib g++-multilib ccache binutils
          fi
          # Install from cached .deb files. apt-get resolves dependencies
          # correctly; dpkg -i alone does not and will silently break on packages
          # with deep dep chains such as gcc-multilib.
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-debs" \
            zip build-essential gcc-multilib g++-multilib ccache binutils

      # ccache key is scoped to the build config so Release and Debug builds
      # never poison each other's cache. The restore-keys fallback lets a new
      # Release build still reuse objects from a previous Release run even when
      # source files have changed — ccache handles per-object staleness itself.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ inputs.build_config }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.build_config }}-
            ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
          mkdir -p game/tf2vintage/bin/linux64
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          # 4G gives the full Source SDK build room to cache without eviction churn.
          # 2G was too tight and caused partial cache hits that slowed rebuilds.
          ccache --set-config=max_size=4.0G
          # mtime is faster than the default content hash for compiler validation.
          ccache --set-config=compiler_check=mtime
          ccache --zero-stats

      - name: Make createtf2vintage executable
        run: chmod +x src/createtf2vintage

      - name: Make vpc executable
        run: chmod +x src/devtools/bin/vpc

      - name: Make protoc executable
        run: chmod +x src/thirdparty/protobuf-2.6.1/bin/linux32/protoc

      - name: Clear stale ninja solution
        run: rm -f src/_vpc_/ninja/sdk_everything_release.ninja src/_vpc_/ninja/sdk_everything_debug.ninja

      - name: Build
        env:
          BUILD_TYPE: ${{ inputs.build_config }}
        run: |
          cd src
          bash createtf2vintage

      - name: Print ccache stats
        if: always()
        run: ccache --show-stats

      - name: Collect binaries into bin/linux64
        run: |
          mkdir -p game/tf2vintage/bin/linux64

          # client.so / server.so — build outputs these to game/mod_tf/bin/linux64/
          find game/mod_tf/bin/linux64/ -maxdepth 1 -name "*.so" \
            -exec cp {} game/tf2vintage/bin/linux64/ \;

          # launcher_tf2vintage (main executable) — goes to the mod root, not bin/linux64
          find game/tf2vintage/ -maxdepth 1 -name "launcher_tf2vintage" \
            -exec cp {} game/tf2vintage/ \; || true
          # Also check mod_tf in case the build places it there
          find game/mod_tf/ -maxdepth 1 -name "launcher_tf2vintage" \
            -exec cp {} game/tf2vintage/ \; 2>/dev/null || true

      - name: Split debug symbols from binaries
        run: |
          mkdir -p debug-symbols
          # Process only .so files in bin/linux64 — launcher_tf2vintage is in the mod root
          find game/tf2vintage/bin/linux64/ -name "*.so" | while read lib; do
            base=$(basename "$lib")
            dbg="debug-symbols/${base}.debug"
            objcopy --only-keep-debug "$lib" "$dbg"
            objcopy --strip-debug "$lib"
            objcopy --add-gnu-debuglink="$dbg" "$lib"
          done

          # Also strip the launcher in the mod root and extract its symbols
          launcher="game/tf2vintage/launcher_tf2vintage"
          if [ -f "$launcher" ]; then
            dbg="debug-symbols/launcher_tf2vintage.debug"
            objcopy --only-keep-debug "$launcher" "$dbg"
            objcopy --strip-debug "$launcher"
            objcopy --add-gnu-debuglink="$dbg" "$launcher"
          fi

      - name: Upload product
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux
          path: |
            game/tf2vintage/bin/linux64/
            game/tf2vintage/launcher_tf2vintage

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux-debugsymbols
          path: debug-symbols/
