name: Linux
on: 
  workflow_call:

env:
  CCACHE_VERSION: 4.0
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip build-essential gcc-multilib g++-multilib podman ccache binutils

      - name: Setup ccache
        run: |
          mkdir -p game/tf2vintage/bin/linux64
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=2.0G

      - name: Build
        run: |
          cd src
          bash createtf2vintage

      - name: Move binaries to bin/linux64
        run: |
          # The build outputs .so files into bin/ — move them to the
          # platform-specific subdirectory the updater and release expect.
          find game/tf2vintage/bin/ -maxdepth 1 -name "*.so" \
            -exec mv {} game/tf2vintage/bin/linux64/ \;

      - name: Split debug symbols from binaries
        run: |
          mkdir -p debug-symbols
          find game/tf2vintage/bin/linux64/ -name "*.so" | while read lib; do
            base=$(basename "$lib")
            dbg="debug-symbols/${base}.debug"

            # 1. Extract DWARF into a sidecar .debug file
            objcopy --only-keep-debug "$lib" "$dbg"

            # 2. Strip all debug sections from the shipped binary
            objcopy --strip-debug "$lib"

            # 3. Embed a GNU debug link so debuggers can locate the sidecar
            #    automatically (addr2line, gdb, crash handler map lookup)
            objcopy --add-gnu-debuglink="$dbg" "$lib"
          done

      - name: Upload product
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux
          path: game/tf2vintage/bin/linux64/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux-debugsymbols
          path: debug-symbols/
