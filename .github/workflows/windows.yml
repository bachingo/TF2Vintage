name: Windows
on:
  workflow_call:
    inputs:
      build_config:
        description: 'MSBuild configuration — Release or Debug'
        type: string
        default: 'Release'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create project
        run: |
          cd src
          .\createtf2vintage.bat

      - name: Build project
        run: |
          cd src
          MSBuild.exe TF2vintage.sln /p:Configuration=${{ inputs.build_config }} /p:Platform="win64" /m /v:m

      - name: Collect binaries into bin/x64
        shell: cmd
        run: |
          mkdir game\tf2vintage\bin\x64 2>nul || true

          :: MSBuild places outputs under <Config>_mod_tf\ or <Config>tf2vintage\ depending on the project.
          :: We copy each known output explicitly so nothing is missed.
          set CFG=${{ inputs.build_config }}

          :: client.dll — src\game\client\<Config>_mod_tf\
          copy /Y src\game\client\%CFG%_mod_tf\client.dll game\tf2vintage\bin\x64\
          copy /Y src\game\client\%CFG%_mod_tf\client.pdb game\tf2vintage\bin\x64\ 2>nul

          :: server.dll — src\game\server\<Config>_mod_tf\
          copy /Y src\game\server\%CFG%_mod_tf\server.dll game\tf2vintage\bin\x64\
          copy /Y src\game\server\%CFG%_mod_tf\server.pdb game\tf2vintage\bin\x64\ 2>nul

          :: crash_handler.dll — src\thirdparty\crash_handler\<Config>tf2vintage\x64\
          copy /Y src\thirdparty\crash_handler\%CFG%tf2vintage\x64\crash_handler.dll game\tf2vintage\bin\x64\
          copy /Y src\thirdparty\crash_handler\%CFG%tf2vintage\x64\crash_handler.pdb game\tf2vintage\bin\x64\ 2>nul

          :: launcher_main (tf2vintage_win64.exe) — src\launcher_main\<Config>_tf2vintage_win64\
          copy /Y src\launcher_main\%CFG%_tf2vintage_win64\tf2vintage_win64.exe game\tf2vintage\bin\x64\
          copy /Y src\launcher_main\%CFG%_tf2vintage_win64\tf2vintage_win64.pdb game\tf2vintage\bin\x64\ 2>nul

          :: legacy launcher_tf2vintage — copy from mod root if present
          if exist game\tf2vintage\launcher_tf2vintage.exe (
            copy /Y game\tf2vintage\launcher_tf2vintage.exe game\tf2vintage\bin\x64\
          )

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-windows
          path: |
            game/tf2vintage/bin/x64/*.dll
            game/tf2vintage/bin/x64/*.exe

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-windows-debugsymbols
          path: game/tf2vintage/bin/x64/*.pdb
