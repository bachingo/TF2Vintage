name: Windows
on:
  workflow_call:
    inputs:
      build_config:
        description: 'MSBuild configuration — Release or Debug'
        type: string
        default: 'Release'

# Use forward slashes — they work on Windows runners and avoid YAML
# interpolation issues that backslash paths can cause in env blocks.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          sparse-checkout: |
            src/
          sparse-checkout-cone-mode: false

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ccache 4.x supports MSVC (cl.exe) natively.
      # We download a pre-built Windows binary, add it to PATH, and record the
      # absolute path so MSBuild's CLToolExe gets a rooted path (required by the
      # file tracker — a bare "ccache" name causes MSB0001).
      - name: Install ccache
        run: |
          $version = "4.10.2"
          $url = "https://github.com/ccache/ccache/releases/download/v${version}/ccache-${version}-windows-x86_64.zip"
          Invoke-WebRequest $url -OutFile ccache.zip
          Expand-Archive ccache.zip -DestinationPath "$env:LOCALAPPDATA\ccache-bin"
          $ccacheDir = (Get-ChildItem "$env:LOCALAPPDATA\ccache-bin" -Directory | Select-Object -First 1).FullName
          echo "$ccacheDir" | Out-File -Append -FilePath $env:GITHUB_PATH

      # ccache key is scoped to build config — Release and Debug never share a cache.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ inputs.build_config }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.build_config }}-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          # Resolve the absolute path to ccache.exe — MSBuild's TrackerExecuteTool
          # requires a fully-rooted compiler path and throws MSB0001 on a bare name.
          $ccacheExe = (Get-Command ccache).Source
          echo "CCACHE_EXE=$ccacheExe" | Out-File -Append -FilePath $env:GITHUB_ENV

          # Resolve the absolute path to cl.exe from the MSVC environment and
          # export it as CCACHE_COMPILER. When MSBuild invokes ccache as CLToolExe
          # it passes a response-file (@...rsp) on the command line; ccache then
          # execs the real compiler itself. Without CCACHE_COMPILER set, ccache
          # searches its own PATH which does not fully inherit the VS developer
          # shell, so cl.exe is not found and every translation unit fails with
          # "execute_noreturn ... failed: No such file or directory".
          $clExe = (Get-Command cl.exe).Source
          echo "CCACHE_COMPILER=$clExe" | Out-File -Append -FilePath $env:GITHUB_ENV

          ccache --set-config="cache_dir=${{ env.CCACHE_DIR }}"
          ccache --set-config="max_size=4.0G"
          # mtime is faster than content-hash for compiler validation on MSVC.
          ccache --set-config="compiler_check=mtime"
          ccache --zero-stats

      - name: Create project
        run: |
          cd src
          .\createtf2vintage.bat

      # /p:CLToolExe — wraps cl.exe with ccache for all compilations.
      #   Must be an absolute (rooted) path; bare "ccache" causes MSB0001.
      # /p:UseSharedCompilation=false — disables the Roslyn shared daemon which
      #   conflicts with ccache's process-level interception.
      # /p:TrackFileAccess=false — disables MSBuild's file tracker (tlog files)
      #   which adds overhead and is redundant when ccache handles caching.
      - name: Build project
        run: |
          cd src
          MSBuild.exe TF2vintage.sln `
            /p:Configuration=${{ inputs.build_config }} `
            /p:Platform="win64" `
            /p:CLToolExe="${{ env.CCACHE_EXE }}" `
            /p:UseSharedCompilation=false `
            /p:TrackFileAccess=false `
            /m /v:m

      - name: Print ccache stats
        if: always()
        run: ccache --show-stats

      - name: Collect binaries into bin/x64
        shell: cmd
        run: |
          mkdir game\tf2vintage\bin\x64 2>nul || true

          set CFG=${{ inputs.build_config }}

          :: client.dll
          copy /Y src\game\client\%CFG%_mod_tf\client.dll game\tf2vintage\bin\x64\
          copy /Y src\game\client\%CFG%_mod_tf\client.pdb game\tf2vintage\bin\x64\ 2>nul

          :: server.dll
          copy /Y src\game\server\%CFG%_mod_tf\server.dll game\tf2vintage\bin\x64\
          copy /Y src\game\server\%CFG%_mod_tf\server.pdb game\tf2vintage\bin\x64\ 2>nul

          :: crash_handler.dll
          copy /Y src\thirdparty\crash_handler\%CFG%tf2vintage\x64\crash_handler.dll game\tf2vintage\bin\x64\
          copy /Y src\thirdparty\crash_handler\%CFG%tf2vintage\x64\crash_handler.pdb game\tf2vintage\bin\x64\ 2>nul

          :: launcher_main — goes to the mod root, not bin/x64
          copy /Y src\launcher_main\%CFG%_tf2vintage_win64\tf2vintage_win64.exe game\tf2vintage\
          copy /Y src\launcher_main\%CFG%_tf2vintage_win64\tf2vintage_win64.pdb game\tf2vintage\bin\x64\ 2>nul

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-windows
          path: |
            game/tf2vintage/bin/x64/*.dll
            game/tf2vintage/tf2vintage_win64.exe

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-windows-debugsymbols
          path: game/tf2vintage/bin/x64/*.pdb
