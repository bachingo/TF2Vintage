name: Linux

on: 
  workflow_call:

env:
  CCACHE_VERSION: 3.7.7
  CCACHE_DIR: ${{ github.workspace }}/src/ccache
  LDFLAGS: -lm

jobs:
  build:
    runs-on:
      ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
      
      - uses: actions/cache@v3
        id: cache
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ steps.get-date.outputs.date }}
          restore-keys: ${{ runner.os }}-
      
      - name: Setup ccache
        run: |
          sudo mkdir -p game/tf2vintage/bin
          cd src
          sudo mkdir -p ./ccache/tmp
          cd devtools/bin/linux
          sudo ./ccache --set-config cache_dir=$CCACHE_DIR
          sudo ./ccache --set-config compression_level=6
      
      - name: Restore cache
        if: steps.cache.outputs.cache-hit == 'true'
        run: sudo bash .github/gh-cache.sh restore
      
      - name: Configure dependencies
        run: sudo apt update && sudo apt install -y zip build-essential gcc-multilib g++-multilib podman

      - name: Build game
        run: cd src && sudo bash createtf2vintage

      - name: Upload product
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-linux
          path: game/tf2vintage/bin/
      
      - name: Move to cache
        run: sudo bash .github/gh-cache.sh
