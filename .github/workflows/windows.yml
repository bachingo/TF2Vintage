name: Windows
on:
  workflow_call:
    inputs:
      build_config:
        description: 'MSBuild configuration — Release or Debug'
        type: string
        default: 'Release'

# Use forward slashes — they work on Windows runners and avoid YAML
# interpolation issues that backslash paths can cause in env blocks.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          sparse-checkout: |
            src/
            game/tf2vintage/bin/x64/
          sparse-checkout-cone-mode: false

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ccache 4.x supports MSVC (cl.exe) natively.
      # We download a pre-built Windows binary, add it to PATH, and record the
      # absolute path so MSBuild's CLToolExe gets a rooted path (required by the
      # file tracker — a bare "ccache" name causes MSB0001).
      - name: Install ccache
        run: |
          $version = "4.10.2"
          $url = "https://github.com/ccache/ccache/releases/download/v${version}/ccache-${version}-windows-x86_64.zip"
          Invoke-WebRequest $url -OutFile ccache.zip
          Expand-Archive ccache.zip -DestinationPath "$env:LOCALAPPDATA\ccache-bin"
          $ccacheDir = (Get-ChildItem "$env:LOCALAPPDATA\ccache-bin" -Directory | Select-Object -First 1).FullName
          echo "$ccacheDir" | Out-File -Append -FilePath $env:GITHUB_PATH

      # ccache key is scoped to build config — Release and Debug never share a cache.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ inputs.build_config }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.build_config }}-
            ${{ runner.os }}-ccache-
          # Always save even on a primary-key hit so new objects compiled since
          # the last run are persisted. Without this, a key match on the first
          # run causes every subsequent run to skip saving and the cache never
          # grows beyond what was stored on the very first cold build.
          save-always: true

      - name: Configure ccache
        run: |
          # Resolve the real cl.exe path from the VS developer environment so we
          # can point CCACHE_COMPILER at it explicitly — ccache needs to know the
          # full path to the real compiler it is wrapping.
          $clExe = (Get-Command cl.exe).Source
          echo "CCACHE_COMPILER=$clExe" | Out-File -Append -FilePath $env:GITHUB_ENV

          ccache --set-config="cache_dir=${{ env.CCACHE_DIR }}"
          ccache --set-config="max_size=4.0G"
          # none is safe on ephemeral CI runners — the compiler never changes
          # within a run, so there is nothing to verify. mtime was causing
          # ccache to reject all invocations on fresh runners.
          ccache --set-config="compiler_check=none"
          # MSVC runs the preprocessor and compiler as separate passes by default.
          # cpp2=true tells ccache to hash the preprocessed output rather than
          # the source file, which is required for correct caching with cl.exe.
          ccache --set-config="run_second_cpp=true"
          ccache --zero-stats

      # MSBuild passes all compiler arguments via a response file (@file.rsp).
      # CLToolExe=ccache therefore calls "ccache @file.rsp", but ccache on
      # Windows does not expand response files — it passes the bare @rsp token
      # to cl.exe, which receives an empty command line, prints its usage banner,
      # and emits no .obj files, causing LNK1181 for every translation unit.
      #
      # The reliable solution is a shim: a real cl.bat placed earlier on PATH
      # than the genuine cl.exe. MSBuild finds cl.bat, calls it normally (with
      # the fully-expanded rsp arguments), and the shim forwards everything to
      # ccache, which then invokes the real cl.exe via CCACHE_COMPILER.
      # This way response-file expansion happens in cmd.exe before ccache ever
      # sees the arguments, so ccache receives a normal compiler invocation.
      - name: Install cl.exe ccache shim
        run: |
          $shimDir = "$env:USERPROFILE\ccache-shim"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null

          # The shim receives the already-expanded arguments from MSBuild and
          # forwards them verbatim to ccache, which wraps the real cl.exe.
          $ccacheExe = (Get-Command ccache).Source
          Set-Content -Path "$shimDir\cl.bat" -Value "@echo off`r`n""$ccacheExe"" %*"

          # Prepend the shim directory so it shadows the real cl.exe on PATH.
          echo "$shimDir" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Create project
        run: |
          cd src
          .\createtf2vintage.bat

      # The launcher_main .vcxproj post-build event copies the built .exe to
      # ..\..\game\tf2vintage_win64.exe — two levels up from src\launcher_main\,
      # landing at the repo root (D:\a\TF2Vintage\TF2Vintage\game\).
      # Other projects copy their outputs into game\tf2vintage\bin\x64\.
      # With only src/ sparse-checked out none of these directories exist, so
      # every post-build copy fails with MSB3073. Pre-create the full tree.
      - name: Create game output directories
        run: |
          New-Item -ItemType Directory -Force -Path game | Out-Null
          New-Item -ItemType Directory -Force -Path game\tf2vintage\bin\x64 | Out-Null

      # No CLToolExe needed — the cl.bat shim on PATH handles ccache wrapping.
      # /p:UseSharedCompilation=false — disables the Roslyn shared daemon which
      #   conflicts with ccache's process-level interception.
      # /p:TrackFileAccess=false — disables MSBuild's file tracker (tlog files)
      #   which adds overhead and is redundant when ccache handles caching.
      - name: Build project
        run: |
          cd src
          MSBuild.exe TF2vintage.sln `
            /p:Configuration=${{ inputs.build_config }} `
            /p:Platform="win64" `
            /p:UseSharedCompilation=false `
            /p:TrackFileAccess=false `
            /m /v:m

      - name: Print ccache stats
        if: always()
        run: ccache --show-stats

      - name: Collect binaries into bin/x64
        shell: cmd
        run: |
          mkdir game\tf2vintage\bin\x64 2>nul

          set CFG=${{ inputs.build_config }}

          :: client.dll
          copy /Y src\game\client\%CFG%_mod_tf\client.dll game\tf2vintage\bin\x64\
          copy /Y src\game\client\%CFG%_mod_tf\client.pdb game\tf2vintage\bin\x64\ 2>nul

          :: server.dll
          copy /Y src\game\server\%CFG%_mod_tf\server.dll game\tf2vintage\bin\x64\
          copy /Y src\game\server\%CFG%_mod_tf\server.pdb game\tf2vintage\bin\x64\ 2>nul

          :: crash_handler.dll
          copy /Y src\thirdparty\crash_handler\%CFG%tf2vintage\x64\crash_handler.dll game\tf2vintage\bin\x64\
          copy /Y src\thirdparty\crash_handler\%CFG%tf2vintage\x64\crash_handler.pdb game\tf2vintage\bin\x64\ 2>nul

          :: launcher_main post-build copies the .exe to game\ (repo root).
          :: Move it into game\tf2vintage\ where the upload step expects it.
          move /Y game\tf2vintage_win64.exe game\tf2vintage\tf2vintage_win64.exe
          copy /Y src\launcher_main\%CFG%_tf2vintage_win64\tf2vintage_win64.pdb game\tf2vintage\bin\x64\ 2>nul

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-windows
          path: |
            game/tf2vintage/bin/x64/*.dll
            game/tf2vintage/tf2vintage_win64.exe

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tf2vintage-windows-debugsymbols
          path: game/tf2vintage/bin/x64/*.pdb
